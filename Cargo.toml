[package]
name = "rustad"
version = "0.1.0"
edition = "2021"
authors = ["Rustad Team"]
description = "High-performance, zero-dependency browser-agnostic adblocking engine in Rust and WebAssembly"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
